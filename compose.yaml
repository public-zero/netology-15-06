
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.python
    restart: on-failure
    environment:
      DB_HOST: db
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
    depends_on:
      - db
    networks:
      backend:
        ipv4_address: 172.20.0.5

  db:
    image: mysql:8
    restart: on-failure
    env_file:
      - .env
    networks:
      backend:
        ipv4_address: 172.20.0.10

include:
  - proxy.yaml

